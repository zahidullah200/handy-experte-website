<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ if .IsHome }}{{ .Site.Title }} | Ankauf, Verkauf, Reparatur & Zubehör{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ .Site.Params.description }}">
<link rel="canonical" href="{{ .Permalink }}">
<link rel="icon" type="image/png" href="{{ "images/mobile_logo.png" | relURL }}">
<link rel="apple-touch-icon" href="{{ "images/mobile_logo.png" | relURL }}">

<meta property="og:type" content="website">
<meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}">
<meta property="og:description" content="{{ .Site.Params.description }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:image" content="{{ "images/homepageimage.png" | absURL }}">
<meta property="og:locale" content="de_DE">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}">
<meta name="twitter:description" content="{{ .Site.Params.description }}">
<meta name="twitter:image" content="{{ "images/homepageimage.png" | absURL }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=typography"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { gold: '#D4AF37', goldlight: '#F1D67A', dark: '#0d0d0d' },
        fontFamily: { sans: ['Poppins', 'sans-serif'] }
      }
    }
  }
</script>
<style>
  html { scroll-behavior: smooth; }
  body { font-family: 'Poppins', sans-serif; overflow-x: hidden; }
  img { max-width: 100%; height: auto; }
  .gold-gradient { background: linear-gradient(135deg, #D4AF37 0%, #F1D67A 50%, #D4AF37 100%); }
  .text-gold-gradient { background: linear-gradient(135deg, #D4AF37 0%, #F1D67A 50%, #D4AF37 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
</style>
</head>
<body class="bg-white text-gray-900">
{{ partial "header.html" . }}
<main>
{{ block "main" . }}{{ end }}
</main>
{{ partial "footer.html" . }}
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>AOS.init({ duration: 800, once: true });</script>
</body>
</html>

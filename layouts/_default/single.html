{{ define "main" }}

    <h1 class="text-3xl md:text-4xl font-extrabold">{{ .Title }}</h1>
  </div>
</section>
<section class="max-w-4xl mx-auto px-6 py-16">
  <div class="prose prose-lg max-w-none prose-headings:font-bold prose-a:text-gold prose-a:no-underline hover:prose-a:underline" data-aos="fade-up">
    {{ .Content }}
  </div>
</section>
{{ end }}
